name: Deploy NEXORA Official Website to Firebase Hosting

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Bundle local Three.js engine
        run: |
          npm install --no-save --no-package-lock three@0.152.2
          mkdir -p games/nexora-runner/vendor
          cp node_modules/three/build/three.min.js games/nexora-runner/vendor/three.min.js

      - name: Deploy NEXORA Official Website to its dedicated site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: nexora-admin-6313f
          channelId: live
