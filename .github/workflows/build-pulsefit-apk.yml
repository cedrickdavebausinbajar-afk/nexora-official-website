name: Build Workout Planner Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'pulsefit/**'
      - '.github/workflows/build-pulsefit-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android project
        run: |
          mkdir workout-planner-android
          cd workout-planner-android
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp -r ../pulsefit/. www/
          npx cap init "Workout Planner" com.cedrickbajar.workoutplanner --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd workout-planner-android/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../Workout-Planner-free.apk
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Workout-Planner-free-APK
          path: Workout-Planner-free.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="workout-planner-build-${{ github.run_number }}"
          gh release create "$TAG" Workout-Planner-free.apk --repo "$GITHUB_REPOSITORY" --title "Workout Planner Free Android APK" --notes "Free Workout Planner Android build. No subscription or Plus lock. Debug-signed APK for testing."
