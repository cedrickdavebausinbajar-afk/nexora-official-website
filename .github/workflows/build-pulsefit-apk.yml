name: Build PulseFit Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'pulsefit/**'
      - '.github/workflows/build-pulsefit-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android project
        run: |
          mkdir pulsefit-android
          cd pulsefit-android
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir www
          cp -r ../pulsefit/* www/
          npx cap init PulseFit com.cedrickbajar.pulsefit --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd pulsefit-android/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../PulseFit-free.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pulsefit-build-${{ github.run_number }}"
          gh release create "$TAG" PulseFit-free.apk --repo "$GITHUB_REPOSITORY" --title "PulseFit Free Android APK" --notes "Free PulseFit Android build. No subscription or Plus lock. This is a debug-signed APK for testing."