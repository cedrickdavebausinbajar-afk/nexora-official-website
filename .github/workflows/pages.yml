name: Deploy NEXORA to GitHub Pages
run-name: Publish NEXORA official website
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Configure Firebase website monitoring
        env:
          NEXORA_FIREBASE_API_KEY: ${{ secrets.NEXORA_FIREBASE_API_KEY }}
          NEXORA_FIREBASE_APP_ID: ${{ secrets.NEXORA_FIREBASE_APP_ID }}
          NEXORA_APPCHECK_RECAPTCHA_SITE_KEY: ${{ secrets.NEXORA_APPCHECK_RECAPTCHA_SITE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          values = {
              "apiKey": os.environ.get("NEXORA_FIREBASE_API_KEY", ""),
              "authDomain": "nexora-admin-6313f.firebaseapp.com",
              "projectId": "nexora-admin-6313f",
              "appId": os.environ.get("NEXORA_FIREBASE_APP_ID", ""),
              "appCheckSiteKey": os.environ.get("NEXORA_APPCHECK_RECAPTCHA_SITE_KEY", ""),
              "version": "website"
          }
          configured = all(values[key] for key in ("apiKey", "appId", "appCheckSiteKey"))
          target = Path("nexora-monitoring-config.js")
          target.write_text(
              "/* Generated during deployment; values are public Firebase web config. */\n"
              "window.NEXORA_ERROR_MONITORING = "
              + json.dumps(values, indent=2)
              + ";\n",
              encoding="utf-8"
          )
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if configured:
              print("Firebase monitoring client configuration injected.")
              summary.write_text("## Website monitoring\\nFirebase public web configuration was injected. Runtime reporting still requires the registered App Check site key and reportClientError callable to be valid.\\n", encoding="utf-8")
          else:
              print("WARNING: Firebase monitoring remains disabled; add all three repository Actions secrets.")
              summary.write_text("## Website monitoring\\n**Disabled:** add NEXORA_FIREBASE_API_KEY, NEXORA_FIREBASE_APP_ID and NEXORA_APPCHECK_RECAPTCHA_SITE_KEY as repository Actions secrets.\\n", encoding="utf-8")
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
