name: Deploy NEXORA to GitHub Pages
run-name: Publish NEXORA official website
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Configure Firebase website monitoring
        env:
          NEXORA_FIREBASE_API_KEY: ${{ secrets.NEXORA_FIREBASE_API_KEY }}
          NEXORA_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXORA_FIREBASE_AUTH_DOMAIN }}
          NEXORA_FIREBASE_PROJECT_ID: ${{ secrets.NEXORA_FIREBASE_PROJECT_ID }}
          NEXORA_FIREBASE_APP_ID: ${{ secrets.NEXORA_FIREBASE_APP_ID }}
          NEXORA_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXORA_FIREBASE_MEASUREMENT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          values = {
              "apiKey": os.environ.get("NEXORA_FIREBASE_API_KEY", ""),
              "authDomain": os.environ.get("NEXORA_FIREBASE_AUTH_DOMAIN", ""),
              "projectId": os.environ.get("NEXORA_FIREBASE_PROJECT_ID", ""),
              "appId": os.environ.get("NEXORA_FIREBASE_APP_ID", ""),
              "measurementId": os.environ.get("NEXORA_FIREBASE_MEASUREMENT_ID", ""),
              "version": "website"
          }
          configured = all(values[key] for key in ("apiKey", "authDomain", "projectId", "appId", "measurementId"))
          target = Path("nexora-monitoring-config.js")
          target.write_text(
              "/* Generated during deployment; values are public Firebase web config. */\n"
              "window.NEXORA_ERROR_MONITORING = "
              + json.dumps(values, indent=2)
              + ";\n",
              encoding="utf-8"
          )
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if configured:
              print("Firebase monitoring client configuration injected.")
              summary.write_text("## Website monitoring\\nFirebase Analytics web configuration was injected for the dedicated NEXORA website project.\\n", encoding="utf-8")
          else:
              print("WARNING: Firebase monitoring remains disabled; add all three repository Actions secrets.")
              summary.write_text("## Website monitoring\\n**Disabled:** add NEXORA_FIREBASE_API_KEY, NEXORA_FIREBASE_AUTH_DOMAIN, NEXORA_FIREBASE_PROJECT_ID, NEXORA_FIREBASE_APP_ID and NEXORA_FIREBASE_MEASUREMENT_ID as repository Actions secrets from a dedicated NEXORA website Firebase project.\\n", encoding="utf-8")
          PY
      - name: Validate website JavaScript and Pages deployment controller
        run: |
          node --check nexora-error-monitoring.js
          node --check nexora-monitoring-config.js
          count=$(grep -RIl 'uses: actions/deploy-pages@' .github/workflows | wc -l)
          test "$count" -eq 1
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
