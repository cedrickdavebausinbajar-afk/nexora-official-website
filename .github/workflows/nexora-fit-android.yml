name: Build NEXORA FIT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - nexora-fit-android-studio-project
    paths:
      - "android-studio-project/**"
      - ".github/workflows/nexora-fit-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android-studio-project --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-FIT-debug-apk
          path: android-studio-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
