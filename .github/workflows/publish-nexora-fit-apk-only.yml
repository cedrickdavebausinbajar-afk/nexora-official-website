name: Publish NEXORA FIT APK only (signed)

on:
  push:
    branches: [nexora-fit-premium-splash-apk-only]
    paths:
      - ".github/workflows/publish-nexora-fit-apk-only.yml"

permissions:
  contents: write

jobs:
  signed-apk-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate signing credentials and version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexora-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/nexora-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/nexora-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set release version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android-studio-project/app/build.gradle.kts")
          s=p.read_text()
          s,n1=re.subn(r'versionCode = [0-9]+','versionCode = 59',s,count=1)
          s,n2=re.subn(r'versionName = "[^"]+"','versionName = "1.3.25"',s,count=1)
          if n1 != 1 or n2 != 1: raise SystemExit("Version update failed")
          p.write_text(s)
          PY
      - name: Build signed release APK
        run: gradle --no-daemon -p android-studio-project assembleRelease
      - name: Verify package and original signing certificate
        run: |
          set -euo pipefail
          APK=android-studio-project/app/build/outputs/apk/release/app-release.apk
          OLD="$RUNNER_TEMP/current-official.apk"
          curl --fail --location --silent --show-error "https://github.com/cedrickdavebausinbajar-afk/nexora-official-website/releases/latest/download/NEXORA-FIT.apk" -o "$OLD"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$OLD" | grep -q "package: name='com.nexora.fit'"
          "$AAPT" dump badging "$APK" | grep -Fq "package: name='com.nexora.fit' versionCode='59' versionName='1.3.25'"
          OLD_CERT=$("$APKSIGNER" verify --print-certs "$OLD" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)
          test -n "$OLD_CERT"
          test "$NEW_CERT" = "$OLD_CERT"
          cp "$APK" NEXORA-FIT.apk
      - name: Publish APK-only GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexora-fit-build-59
          name: NEXORA FIT 1.3.25 (build 59)
          make_latest: true
          files: NEXORA-FIT.apk
          body: |
            Official signed NEXORA FIT update.
            Premium black and champagne-gold splash screen.
            Verified package identity and original signing certificate.
