name: Build NEXORA FIT APK

on:
  workflow_dispatch:
  push:
    paths:
      - "fit/**"
      - "logo.svg"
      - "assets/logo.svg"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/prepare-android.js"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare app files
        run: npm run prepare:android

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          npx --yes @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#071522" --iconBackgroundColorDark "#071522" --splashBackgroundColor "#071522" --splashBackgroundColorDark "#071522"

      - name: Set app version
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 6/' android/app/build.gradle
          sed -i -E "s/versionName ['\"][^'\"]+['\"]/versionName \"1.2.0\"/" android/app/build.gradle

      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/NEXORA FIT.apk"

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexora-fit-build-${{ github.run_number }}
          name: NEXORA FIT Android build ${{ github.run_number }}
          make_latest: true
          files: android/app/build/outputs/apk/debug/NEXORA FIT.apk
          body: |
            Installable Android debug APK for NEXORA FIT.
            This build packages the current NEXORA FIT web app in a Capacitor Android shell.
