name: Build NEXORA FIT APK

on:
  workflow_dispatch:
  push:
    paths:
      - "fit/**"
      - "logo.svg"
      - "assets/logo.svg"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/prepare-android.js"
      - ".github/workflows/build-android-apk.yml"
      - "version.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare app files
        run: npm run prepare:android

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          npx --yes @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#071522" --iconBackgroundColorDark "#071522" --splashBackgroundColor "#071522" --splashBackgroundColorDark "#071522"

      - name: Add native automatic APK updater
        run: |
          mkdir -p android/app/src/main/java/com/nexora/fit
          cat > android/app/src/main/java/com/nexora/fit/FitUpdaterPlugin.java <<'JAVA'
          package com.nexora.fit;

          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Environment;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.HashMap;

          @CapacitorPlugin(name = "FitUpdater")
          public class FitUpdaterPlugin extends Plugin {
              private static final String PREFS = "nexora_fit_updater";
              private static final String ID_KEY = "download_id";
              private static final String VERSION_KEY = "download_version";

              private DownloadManager manager() {
                  return (DownloadManager) getContext().getSystemService(Context.DOWNLOAD_SERVICE);
              }

              private HashMap<String, Object> inspect(long id) {
                  HashMap<String, Object> result = new HashMap<>();
                  result.put("downloadId", id);
                  result.put("ready", false);
                  DownloadManager.Query query = new DownloadManager.Query().setFilterById(id);
                  try (Cursor cursor = manager().query(query)) {
                      if (cursor != null && cursor.moveToFirst()) {
                          int status = cursor.getInt(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                          long downloaded = cursor.getLong(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                          long total = cursor.getLong(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                          result.put("downloaded", downloaded);
                          result.put("total", total);
                          String state = "unknown";
                          if (status == DownloadManager.STATUS_PENDING) state = "pending";
                          else if (status == DownloadManager.STATUS_RUNNING) state = "running";
                          else if (status == DownloadManager.STATUS_PAUSED) state = "paused";
                          else if (status == DownloadManager.STATUS_SUCCESSFUL) { state = "complete"; result.put("ready", true); }
                          else if (status == DownloadManager.STATUS_FAILED) state = "failed";
                          result.put("status", state);
                      } else {
                          result.put("status", "missing");
                      }
                  } catch (Exception e) {
                      result.put("status", "missing");
                  }
                  return result;
              }

              @PluginMethod
              public void getDownloadStatus(PluginCall call) {
                  long id = getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE).getLong(ID_KEY, -1);
                  String version = getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(VERSION_KEY, "");
                  JSObject out = new JSObject();
                  out.put("version", version);
                  if (id < 0) { out.put("status", "none"); out.put("ready", false); }
                  else for (String key : inspect(id).keySet()) out.put(key, inspect(id).get(key));
                  call.resolve(out);
              }

              @PluginMethod
              public void downloadUpdate(PluginCall call) {
                  String url = call.getString("url", "");
                  String version = call.getString("version", "");
                  Uri uri = Uri.parse(url);
                  if (!"https".equalsIgnoreCase(uri.getScheme()) || !"github.com".equalsIgnoreCase(uri.getHost()) || version.trim().isEmpty()) {
                      call.reject("Only a valid official NEXORA FIT GitHub release URL can be downloaded.");
                      return;
                  }
                  android.content.SharedPreferences prefs = getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  long oldId = prefs.getLong(ID_KEY, -1);
                  String oldVersion = prefs.getString(VERSION_KEY, "");
                  if (oldId >= 0 && version.equals(oldVersion)) {
                      HashMap<String, Object> old = inspect(oldId);
                      String state = String.valueOf(old.get("status"));
                      if ("running".equals(state) || "pending".equals(state) || "paused".equals(state) || "complete".equals(state)) {
                          JSObject out = new JSObject();
                          out.put("alreadyStarted", true);
                          out.put("version", version);
                          out.put("status", state);
                          call.resolve(out);
                          return;
                      }
                  }
                  if (oldId >= 0) manager().remove(oldId);
                  try {
                      DownloadManager.Request request = new DownloadManager.Request(uri);
                      request.setTitle("NEXORA FIT " + version);
                      request.setDescription("Downloading your NEXORA FIT update");
                      request.setMimeType("application/vnd.android.package-archive");
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setAllowedOverMetered(true);
                      request.setAllowedOverRoaming(false);
                      request.setDestinationInExternalFilesDir(getContext(), Environment.DIRECTORY_DOWNLOADS, "NEXORA-FIT-update.apk");
                      long id = manager().enqueue(request);
                      prefs.edit().putLong(ID_KEY, id).putString(VERSION_KEY, version).apply();
                      JSObject out = new JSObject();
                      out.put("downloadId", id);
                      out.put("status", "started");
                      out.put("version", version);
                      call.resolve(out);
                  } catch (Exception e) {
                      call.reject("Could not start the update download: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void installUpdate(PluginCall call) {
                  long id = getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE).getLong(ID_KEY, -1);
                  if (id < 0 || !Boolean.TRUE.equals(inspect(id).get("ready"))) {
                      call.reject("The update has not finished downloading yet.");
                      return;
                  }
                  try {
                      Uri apk = manager().getUriForDownloadedFile(id);
                      if (apk == null) { call.reject("The downloaded update file is unavailable."); return; }
                      Intent install = new Intent(Intent.ACTION_VIEW);
                      install.setDataAndType(apk, "application/vnd.android.package-archive");
                      install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(install);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Android could not open the installer: " + e.getMessage());
                  }
              }
          }
          JAVA
          cat > android/app/src/main/java/com/nexora/fit/MainActivity.java <<'JAVA'
          package com.nexora.fit;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(FitUpdaterPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          permission='    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in s:
              s=s.replace("<manifest", "<manifest", 1)
              pos=s.find(">", s.find("<manifest"))+1
              s=s[:pos]+"\n"+permission+s[pos:]
          p.write_text(s)
          PY

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/nexora-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          pattern = r'    buildTypes\s*\{\s*release\s*\{'
          replacement = '''    signingConfigs {
                  release {
                      storeFile file("../nexora-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release'''
          s, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit("Could not locate the Android release build configuration.")
          p.write_text(s)
          PY

      - name: Set app version
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 13/' android/app/build.gradle
          sed -i -E 's/versionName "[^"]*"/versionName "1.2.7"/' android/app/build.gradle

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK for download
        run: cp android/app/build/outputs/apk/release/app-release.apk "NEXORA.FIT.apk"

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexora-fit-build-${{ github.run_number }}
          name: NEXORA FIT Android build ${{ github.run_number }}
          make_latest: true
          files: NEXORA.FIT.apk
          body: |
            Signed release APK for NEXORA FIT.
            Includes the latest NEXORA FIT app and in-app update checker.
