name: Build NEXORA FIT APK

on:
  workflow_dispatch:
  push:
    paths:
      - "fit/**"
      - "logo.svg"
      - "assets/logo.svg"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/prepare-android.js"
      - ".github/workflows/build-android-apk.yml"
      - "version.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare app files
        run: npm run prepare:android

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          npx --yes @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#071522" --iconBackgroundColorDark "#071522" --splashBackgroundColor "#071522" --splashBackgroundColorDark "#071522"

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/nexora-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          pattern = r'    buildTypes\s*\{\s*release\s*\{'
          replacement = '''    signingConfigs {
                  release {
                      storeFile file("../nexora-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release'''
          s, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit("Could not locate the Android release build configuration.")
          p.write_text(s)
          PY

      - name: Set app version
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 9/' android/app/build.gradle
          sed -i -E 's/versionName "[^"]*"/versionName "1.2.3"/' android/app/build.gradle

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK for download
        run: cp android/app/build/outputs/apk/release/app-release.apk "NEXORA.FIT.apk"

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexora-fit-build-${{ github.run_number }}
          name: NEXORA FIT Android build ${{ github.run_number }}
          make_latest: true
          files: NEXORA.FIT.apk
          body: |
            Signed release APK for NEXORA FIT.
            Includes the latest NEXORA FIT app and in-app update checker.
