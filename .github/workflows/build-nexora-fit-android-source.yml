name: Build NEXORA FIT Android source

on:
  push:
    paths:
      - "android-studio-project/**"
      - "scripts/prepare-android.js"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-nexora-fit-android-source.yml"
  pull_request:
    paths:
      - "android-studio-project/**"
      - "scripts/prepare-android.js"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-nexora-fit-android-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare and verify Capacitor web assets
        run: |
          npm run prepare:android
          test -s www/index.html
          test -s www/logo.svg
          test -s www/version.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon -p android-studio-project assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-fit-debug-apk
          path: android-studio-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
